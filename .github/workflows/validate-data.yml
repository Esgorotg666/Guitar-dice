name: Validate data

on:
  push:
    paths:
      - 'public/data/**'
      - 'schema/**'
      - 'scripts/validate-data.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'public/data/**'
      - 'schema/**'
      - 'scripts/validate-data.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate public/data JSON
        run: npm run validate-data
